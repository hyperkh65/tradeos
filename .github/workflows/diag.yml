name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== newerp lib/notion.ts 전체 DB 목록 ==="
            cat /volume1/web/newerp/src/lib/notion.ts 2>/dev/null

            echo ""
            echo "=== newerp .env.local 실제 값 ==="
            cat /volume1/web/newerp/.env.local 2>/dev/null || echo "없음"
