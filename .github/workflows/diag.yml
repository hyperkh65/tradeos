name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== DNS: gw.ynk2014.com ==="
            nslookup gw.ynk2014.com 8.8.8.8 2>/dev/null | grep -E "Address|Name" || echo "nslookup failed"
            echo "=== DNS: www.ynk2014.com ==="
            nslookup www.ynk2014.com 8.8.8.8 2>/dev/null | grep -E "Address|Name" || echo "nslookup failed"
            echo "=== curl gw.ynk2014.com from NAS (external IP) ==="
            curl -sk --max-time 5 -o /dev/null -w "status:%{http_code}" https://gw.ynk2014.com/ 2>/dev/null && echo "" || echo "timeout/fail"
            echo "=== curl www.ynk2014.com from NAS ==="
            curl -sk --max-time 5 -o /dev/null -w "status:%{http_code}" https://www.ynk2014.com/ 2>/dev/null && echo "" || echo "timeout/fail"
