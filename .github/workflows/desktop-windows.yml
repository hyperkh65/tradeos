name: Build Windows Desktop App

# 수동 트리거 전용 — 데스크톱 설치파일은 웹 배포(deploy.yml)와 별개 주기로 나온다.
# 이 Mac에는 Windows 빌드 환경이 없어서, Windows installer(.msi/.exe)를 실제로
# 만들 수 있는 방법은 이 windows-latest 러너뿐이다.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers
        run: npx tauri build

      - name: List and checksum artifacts
        shell: bash
        run: |
          set -e
          echo "=== bundle output ==="
          find src-tauri/target/release/bundle -type f \( -iname "*.msi" -o -iname "*.exe" \) -exec ls -la {} \;
          echo "=== sha256 ==="
          find src-tauri/target/release/bundle -type f \( -iname "*.msi" -o -iname "*.exe" \) -exec sha256sum {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: ynk-groupware-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
