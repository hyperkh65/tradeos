name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== server.ReverseProxy.conf ==="
            cat /etc/nginx/conf.d/server.ReverseProxy.conf 2>/dev/null
            echo "=== erp.ynk2014.com.conf ==="
            cat /etc/nginx/conf.d/erp.ynk2014.com.conf 2>/dev/null
            echo "=== 307 redirect destination ==="
            curl -sk --max-time 3 -D - https://192.168.0.7/ -H "Host: gw.ynk2014.com" 2>&1 | grep -E "HTTP|Location|location"
            echo "=== DNS resolution on NAS ==="
            nslookup gw.ynk2014.com 127.0.0.1 2>/dev/null || echo "nslookup failed"
            nslookup gw.ynk2014.com 2>/dev/null | grep "Address"
