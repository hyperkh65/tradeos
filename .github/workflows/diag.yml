name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== port 3103 listening? ==="
            netstat -tlnp 2>/dev/null | grep 3103 || echo "3103 NOT LISTENING"
            echo "=== tradeos.pid ==="
            cat /tmp/tradeos.pid 2>/dev/null || echo "no pid file"
            echo "=== tradeos.log (last 30 lines) ==="
            tail -30 /tmp/tradeos.log 2>/dev/null || echo "no log"
            echo "=== nginx proxy_pass for gw.ynk2014.com ==="
            grep -A5 "gw.ynk2014.com" /etc/nginx/sites-enabled/* 2>/dev/null | grep -E "proxy_pass|server_name" || echo "not found"
            echo "=== curl localhost:3103 ==="
            curl -s -o /dev/null -w "status:%{http_code}" http://localhost:3103/ 2>/dev/null || echo "curl failed"
