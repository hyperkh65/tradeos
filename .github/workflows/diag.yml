name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node
            TRADEOS_DIR=/volume1/web/tradeos

            echo "=== tradeos companies SQLite 현황 ==="
            $NODE -e "
              const Database = require('$TRADEOS_DIR/.next/standalone/node_modules/better-sqlite3');
              const db = new Database('$TRADEOS_DIR/data/nexport.db');
              const cnt = db.prepare('SELECT COUNT(*) as c FROM companies').get();
              console.log('companies count:', cnt.c);
              const rows = db.prepare('SELECT id, name, type, business_id FROM companies ORDER BY created_at DESC LIMIT 10').all();
              rows.forEach(r => console.log(JSON.stringify(r)));
              db.close();
            " 2>&1

            echo ""
            echo "=== tradeos .env 또는 실행환경에서 NOTION_DB_COMPANIES 확인 ==="
            # Check running process env
            cat $TRADEOS_DIR/.env.local 2>/dev/null | grep -i "NOTION_DB_COMPANIES\|NOTION_TOKEN" || echo "No .env.local"
            cat $TRADEOS_DIR/.env 2>/dev/null | grep -i "NOTION_DB_COMPANIES\|NOTION_TOKEN" || echo "No .env"

            echo ""
            echo "=== newerp notion.ts에서 CLIENTS DB ID 확인 ==="
            grep -n "CLIENTS\|DB_CLIENT\|clients" /volume1/web/newerp/src/lib/notion.ts 2>/dev/null | head -10

            echo ""
            echo "=== Notion companies DB 샘플 조회 (첫 3개 페이지 필드명 확인) ==="
            $NODE -e "
              const https = require('https');
              const token = process.env.NOTION_TOKEN || '';
              const dbId = process.env.NOTION_DB_COMPANIES || '';
              console.log('NOTION_TOKEN set:', !!token);
              console.log('NOTION_DB_COMPANIES:', dbId || 'NOT SET');
              if (!token || !dbId) { console.log('Cannot query - missing env'); process.exit(0); }

              const options = {
                hostname: 'api.notion.com',
                path: '/v1/databases/' + dbId + '/query',
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Notion-Version': '2022-06-28' }
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    if (json.results && json.results.length > 0) {
                      console.log('Total found (first page):', json.results.length, '| has_more:', json.has_more);
                      const p = json.results[0];
                      console.log('Field names:', Object.keys(p.properties).join(', '));
                      const props = p.properties;
                      const fields = ['ClientName', '이름', 'Name', 'BusinessNo', '코드', 'Type', '유형', 'Tel', 'Email'];
                      fields.forEach(f => {
                        if (props[f]) console.log(f + ':', JSON.stringify(props[f]).slice(0,80));
                      });
                    } else {
                      console.log('No results or error:', JSON.stringify(json).slice(0,200));
                    }
                  } catch(e) { console.log('Parse error:', e.message, data.slice(0,200)); }
                });
              });
              req.write(JSON.stringify({ page_size: 3 }));
              req.end();
            " 2>&1
