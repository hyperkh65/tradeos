name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== DB_CLIENTS 찾기 ==="
            grep -r "DB_CLIENTS\|CLIENTS\s*=" /volume1/web/newerp/src 2>/dev/null | head -20

            echo ""
            echo "=== notion.ts DB_ 라인만 ==="
            grep "^export const DB_" /volume1/web/newerp/src/lib/notion.ts 2>/dev/null

            echo ""
            echo "=== newerp crm/page.tsx 상단 import ==="
            head -20 /volume1/web/newerp/src/app/crm/page.tsx 2>/dev/null
