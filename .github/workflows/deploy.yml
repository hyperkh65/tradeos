name: Deploy to NAS (gw.ynk2014.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          DEMO_MODE: ${{ secrets.TRADEOS_DEMO_MODE || 'true' }}
          AUTH_SECRET: ${{ secrets.TRADEOS_AUTH_SECRET }}
          NOTION_TOKEN: ${{ secrets.TRADEOS_NOTION_TOKEN }}
          NOTION_DB_COMPANIES: ${{ secrets.TRADEOS_NOTION_DB_COMPANIES }}
          NOTION_DB_PRODUCTS: ${{ secrets.TRADEOS_NOTION_DB_PRODUCTS }}
          NOTION_DB_TASKS: ${{ secrets.TRADEOS_NOTION_DB_TASKS }}
          NOTION_DB_PURCHASE_ORDERS: ${{ secrets.TRADEOS_NOTION_DB_PURCHASE_ORDERS }}
          NOTION_DB_INSPECTIONS: ${{ secrets.TRADEOS_NOTION_DB_INSPECTIONS }}
          NOTION_DB_SHIPMENTS: ${{ secrets.TRADEOS_NOTION_DB_SHIPMENTS }}
          NOTION_DB_QUOTES: ${{ secrets.TRADEOS_NOTION_DB_QUOTES }}
          NOTION_DB_IMPORTS: ${{ secrets.TRADEOS_NOTION_DB_IMPORTS }}
          NOTION_DB_CLAIMS: ${{ secrets.TRADEOS_NOTION_DB_CLAIMS }}
          NOTION_DB_EXPENSES: ${{ secrets.TRADEOS_NOTION_DB_EXPENSES }}
          NOTION_DB_HR: ${{ secrets.TRADEOS_NOTION_DB_HR }}
          NOTION_DB_INVENTORY: ${{ secrets.TRADEOS_NOTION_DB_INVENTORY }}
          NOTION_DB_SALES: ${{ secrets.TRADEOS_NOTION_DB_SALES }}
          NOTION_DB_PROFIT_ANALYSIS: ${{ secrets.TRADEOS_NOTION_DB_PROFIT_ANALYSIS }}
          NOTION_DB_ESTIMATOR: ${{ secrets.NOTION_DB_ESTIMATOR }}
          NOTION_DB_APPROVALS: ${{ secrets.NOTION_DB_APPROVALS }}
          NOTION_DB_TRADE_STATEMENTS: ${{ secrets.NOTION_DB_TRADE_STATEMENTS }}
          NOTION_DB_COMMISSIONS: ${{ secrets.NOTION_DB_COMMISSIONS }}
          NAS_WEBDAV_URL: ${{ secrets.TRADEOS_NAS_WEBDAV_URL }}
          NAS_USERNAME: ${{ secrets.TRADEOS_NAS_USERNAME }}
          NAS_PASSWORD: ${{ secrets.TRADEOS_NAS_PASSWORD }}
          NEXT_PUBLIC_APP_URL: https://gw.ynk2014.com
        run: npm run build

      - name: Domain hardcoding check (비차단 — 정보성)
        run: node scripts/check-hardcoded-domain.js
        env:
          NEXT_PUBLIC_APP_URL: https://gw.ynk2014.com

      - name: Generate BUILD_INFO.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            fs.writeFileSync('BUILD_INFO.json', JSON.stringify({
              gitCommit: process.env.GITHUB_SHA,
              gitBranch: process.env.GITHUB_REF_NAME,
              buildTime: new Date().toISOString(),
              packageVersion: pkg.version,
            }, null, 2));
          "

      - name: Prepare NAS directory
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /volume1/web/tradeos
            mkdir -p /volume1/web/tradeos/data
            mkdir -p /volume1/web/tradeos/data/uploads
            # 이전 배포의 서버 프로세스가 아직 그 디렉토리의 파일을 서빙 중일 때
            # rm -rf가 "Directory not empty"로 실패하는 경우가 있다(경합) — 몇 번
            # 재시도하고, 그래도 안 되면 다음 배포 단계(cp -r로 덮어씀)가 대부분
            # 커버하므로 전체 배포를 막지 않고 넘어간다.
            for i in 1 2 3 4 5; do
              rm -rf /volume1/web/tradeos/.next/standalone/.next && break
              echo "rm -rf attempt $i failed (dir busy), retrying in 3s..."
              sleep 3
            done

      - name: Copy build to NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          source: ".next/standalone/,.next/static/,public/,BUILD_INFO.json,recovery/"
          target: /volume1/web/tradeos/

      - name: Ensure docverify container running
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 1m
          script: |
            DOCKER=/var/packages/ContainerManager/target/usr/bin/docker
            if ! $DOCKER ps --format '{{.Names}}' | grep -qx tradeos-docverify; then
              $DOCKER rm -f tradeos-docverify 2>/dev/null || true
              $DOCKER run -d --name tradeos-docverify --restart unless-stopped \
                -v /volume1/web/tradeos/data:/volume1/web/tradeos/data \
                -v /tmp:/tmp \
                tradeos-docverify
              echo "docverify container started"
            else
              echo "docverify container already running"
            fi

      - name: Deploy on NAS
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node
            mkdir -p /volume1/web/tradeos/.next/standalone/.next
            mkdir -p /volume1/web/tradeos/.next/standalone/public
            rm -rf /volume1/web/tradeos/.next/standalone/.next/static
            cp -r /volume1/web/tradeos/.next/static /volume1/web/tradeos/.next/standalone/.next/static
            cp -rp /volume1/web/tradeos/public/. /volume1/web/tradeos/.next/standalone/public/ 2>/dev/null || true
            # Kill by PID file
            OLD_PID=$(cat /tmp/tradeos.pid 2>/dev/null)
            [ -n "$OLD_PID" ] && kill -9 $OLD_PID 2>/dev/null || true
            # Kill by port - use ss (more reliable than netstat on Synology)
            for PORT_KILL in 3103 3203; do
              PIDS=$(ss -tlnp 2>/dev/null | grep ":${PORT_KILL} " | grep -oP '(?<=pid=)\d+' | sort -u)
              if [ -z "$PIDS" ]; then
                PIDS=$(netstat -tlnp 2>/dev/null | grep ":${PORT_KILL} " | grep -oP '^\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\K\d+' | sort -u)
              fi
              [ -n "$PIDS" ] && echo "Killing PIDs on port ${PORT_KILL}: $PIDS" && kill -9 $PIDS 2>/dev/null || true
            done
            # Also remove nas-server.js leftover if present
            rm -f /volume1/web/tradeos/nas-server.js /volume1/web/tradeos/.next/standalone/nas-server.js
            sleep 2
            > /tmp/tradeos.log
            PORT=3103 \
            AUTH_SECRET="${{ secrets.TRADEOS_AUTH_SECRET }}" \
            DEMO_MODE="false" \
            SQLITE_DB_PATH="/volume1/web/tradeos/data/nexport.db" \
            UPLOAD_DIR="/volume1/web/tradeos/data/uploads" \
            DOCVERIFY_CONTAINER="tradeos-docverify" \
            DOCVERIFY_DOCKER_BIN="/var/packages/ContainerManager/target/usr/bin/docker" \
            AI_ENABLED="${{ secrets.TRADEOS_AI_ENABLED }}" \
            QDRANT_URL="http://127.0.0.1:6333" \
            NOTION_TOKEN="${{ secrets.TRADEOS_NOTION_TOKEN }}" \
            NOTION_DB_COMPANIES="${{ secrets.TRADEOS_NOTION_DB_COMPANIES }}" \
            NOTION_DB_PRODUCTS="${{ secrets.TRADEOS_NOTION_DB_PRODUCTS }}" \
            NOTION_DB_TASKS="${{ secrets.TRADEOS_NOTION_DB_TASKS }}" \
            NOTION_DB_QUOTES="${{ secrets.TRADEOS_NOTION_DB_QUOTES }}" \
            NOTION_DB_PURCHASE_ORDERS="${{ secrets.TRADEOS_NOTION_DB_PURCHASE_ORDERS }}" \
            NOTION_DB_SHIPMENTS="${{ secrets.TRADEOS_NOTION_DB_SHIPMENTS }}" \
            NOTION_DB_IMPORTS="${{ secrets.TRADEOS_NOTION_DB_IMPORTS }}" \
            NOTION_DB_EXPENSES="${{ secrets.TRADEOS_NOTION_DB_EXPENSES }}" \
            NOTION_DB_CLAIMS="${{ secrets.TRADEOS_NOTION_DB_CLAIMS }}" \
            NOTION_DB_INSPECTIONS="${{ secrets.TRADEOS_NOTION_DB_INSPECTIONS }}" \
            NOTION_DB_HR="${{ secrets.TRADEOS_NOTION_DB_HR }}" \
            NOTION_DB_INVENTORY="${{ secrets.TRADEOS_NOTION_DB_INVENTORY }}" \
            NOTION_DB_SALES="${{ secrets.TRADEOS_NOTION_DB_SALES }}" \
            NOTION_DB_ESTIMATOR="${{ secrets.NOTION_DB_ESTIMATOR }}" \
            NOTION_DB_APPROVALS="${{ secrets.NOTION_DB_APPROVALS }}" \
            NOTION_DB_PROFIT_ANALYSIS="${{ secrets.TRADEOS_NOTION_DB_PROFIT_ANALYSIS }}" \
            NOTION_DB_TRADE_STATEMENTS="${{ secrets.NOTION_DB_TRADE_STATEMENTS }}" \
            NOTION_DB_COMMISSIONS="${{ secrets.NOTION_DB_COMMISSIONS }}" \
            $NODE /volume1/web/tradeos/.next/standalone/server.js >> /tmp/tradeos.log 2>&1 &
            echo $! > /tmp/tradeos.pid
            # NAS 부하에 따라 포트 바인딩까지 걸리는 시간이 들쭉날쭉하다(5초로는
            # 부족해서 실제로는 뜬 서버를 "실패"로 오판하고 배포를 중단시킨 적 있음)
            # — 고정 sleep 대신 최대 30초까지 반복 확인한다.
            OK=0
            for i in $(seq 1 15); do
              sleep 2
              if $NODE -e "require('http').get('http://localhost:3103',(r)=>{process.exit(0)}).on('error',()=>process.exit(1))"; then
                OK=1
                break
              fi
            done
            if [ "$OK" = "1" ]; then
              echo "TradeOS OK - PID=$(cat /tmp/tradeos.pid) port=3103 (attempt $i)"
            else
              echo "ERROR: server failed" && tail -30 /tmp/tradeos.log && exit 1
            fi

      # 핵심 그룹웨어 배포가 끝난 뒤에만 실행한다 — 이 NAS는 디스크 I/O가 느려서,
      # 앞선 배포 스텝과 동시에 이미지를 pull하면 그 스텝의 파일 복사가 I/O 경합으로
      # 타임아웃나는 사고가 실제로 있었다(이 스텝은 AI 도우미 전용, 기본 OFF라
      # 언제 끝나든 핵심 배포에는 영향이 없어야 함 — continue-on-error + 백그라운드).
      - name: Ensure Qdrant container running
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 45s
          script: |
            DOCKER=/var/packages/ContainerManager/target/usr/bin/docker
            mkdir -p /volume1/web/tradeos/data/qdrant
            if ! $DOCKER ps --format '{{.Names}}' | grep -qx tradeos-qdrant; then
              $DOCKER rm -f tradeos-qdrant 2>/dev/null || true
              nohup $DOCKER run -d --name tradeos-qdrant --restart unless-stopped \
                -p 127.0.0.1:6333:6333 \
                -v /volume1/web/tradeos/data/qdrant:/qdrant/storage \
                qdrant/qdrant:latest > /tmp/tradeos-qdrant-start.log 2>&1 &
              disown
              echo "qdrant container start requested in background(핵심 배포는 이미 끝났음)"
              # "컨테이너가 떴다"와 "Qdrant가 실제로 요청을 받을 준비가 됐다"는 다르다 —
              # 앱이 QDRANT_URL로 곧바로 질의했을 때 "fetch failed"가 나던 원인이 이 차이였다.
              # 이미지가 이미 로컬에 있으면(재배포) 보통 수 초 안에 뜨므로, command_timeout
              # 안에서 짧게(최대 20초) 기다려보고 로그를 남긴다 — 최초 pull처럼 오래 걸리면
              # 그냥 백그라운드로 계속 진행(재시도는 앱의 Qdrant 클라이언트 자체가 처리함).
              READY=0
              for i in $(seq 1 10); do
                sleep 2
                if curl -sf -o /dev/null http://127.0.0.1:6333/ ; then READY=1; break; fi
              done
              if [ "$READY" = "1" ]; then
                echo "qdrant ready after ~$((i*2))s"
              else
                echo "qdrant not ready yet within 20s — 계속 백그라운드에서 기동 중(다음 요청부터 앱 쪽 재시도 로직이 흡수함)"
              fi
            else
              if curl -sf -o /dev/null http://127.0.0.1:6333/ ; then
                echo "qdrant container already running and healthy"
              else
                echo "WARNING: qdrant container is running but not responding on :6333 — 재시작이 필요할 수 있음"
              fi
            fi
