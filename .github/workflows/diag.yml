name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            echo "=== newerp docker-compose.yml ==="
            cat /volume1/web/newerp/docker-compose.yml 2>/dev/null | sed 's/=.*/=***/' || echo "없음"

            echo ""
            echo "=== newerp src 구조 ==="
            find /volume1/web/newerp/src -type f -name "*.ts" -o -name "*.tsx" 2>/dev/null | head -30

            echo ""
            echo "=== newerp .next/standalone 있는지 ==="
            ls /volume1/web/newerp/.next/standalone/ 2>/dev/null | head -5 || echo "없음"

            echo ""
            echo "=== port 3100 실행중인 앱 ==="
            ls -la /proc/$(ss -tlnp 2>/dev/null | grep ":3100 " | grep -oP '(?<=pid=)\d+' | head -1)/exe 2>/dev/null || echo "pid 못찾음"
