name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            echo "=== newerp .env.local ==="
            cat /volume1/web/newerp/.env.local 2>/dev/null | grep -v "^#" | grep -v "^$" | sed 's/=.*/=***/' || echo "없음"

            echo ""
            echo "=== newerp .env ==="
            cat /volume1/web/newerp/.env 2>/dev/null | grep -v "^#" | grep -v "^$" | sed 's/=.*/=***/' || echo "없음"

            echo ""
            echo "=== newerp src/ 구조 ==="
            find /volume1/web/newerp/src -name "*.ts" -o -name "*.tsx" 2>/dev/null | grep -i "sale\|매출" | head -10

            echo ""
            echo "=== newerp이 실행 중인지 확인 ==="
            ps aux 2>/dev/null | grep "newerp\|ynk-erp" | grep -v grep | head -5

            echo ""
            echo "=== newerp 포트 확인 ==="
            ss -tlnp 2>/dev/null | grep -E "3000|3001|3002|3100|3200" || netstat -tlnp 2>/dev/null | grep -E "3000|3001|3002|3100|3200"
