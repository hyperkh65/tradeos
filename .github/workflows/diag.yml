name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== .service w3conf (actual gw.ynk2014.com nginx config) ==="
            cat /usr/local/etc/nginx/conf.d-available/14990dea-ff2f-42f3-ba48-ae8020ef924c.w3conf 2>/dev/null || echo "FILE NOT FOUND"
            echo "=== outer webservice_portal w3conf ==="
            cat /usr/local/etc/nginx/conf.d-available/0787e48a-365b-4da6-ae6e-bec1899a728c.w3conf 2>/dev/null || echo "FILE NOT FOUND"
            echo "=== grep 3103 in conf.d-available ==="
            grep -rn "3103" /usr/local/etc/nginx/conf.d-available/ 2>/dev/null || echo "NOT FOUND"
            echo "=== loov.co.kr.conf ==="
            cat /usr/local/etc/nginx/conf.d/loov.co.kr.conf 2>/dev/null || echo "NOT FOUND"
