name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== .service conf (actual gw.ynk2014.com config) ==="
            cat /usr/local/etc/nginx/conf.d/.service.fba80f1a-ff3a-43fc-b1ec-0642664461ea.ca2cdaa3-1b14-4984-b169-ece9d6d75122.conf 2>/dev/null || echo "FILE NOT FOUND"
            echo "=== all conf files in nginx conf.d ==="
            ls -la /usr/local/etc/nginx/conf.d/ 2>/dev/null
            echo "=== search 3103 in all nginx confs ==="
            grep -rn "3103" /usr/local/etc/nginx/conf.d/ /etc/nginx/conf.d/ 2>/dev/null || echo "NOT FOUND"
            echo "=== port listening ==="
            netstat -tlnp 2>/dev/null | grep -E ':443|:80|:3103' || cat /proc/net/tcp | awk '{print $2}' | cut -d: -f2 | while read h; do printf "%d\n" "0x$h"; done | sort -n | grep -E "^80$|^443$|^3103$" || true
