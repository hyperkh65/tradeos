name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== ports ==="
            ss -tlnp 2>/dev/null | grep -E '3103|3203' || netstat -tlnp 2>/dev/null | grep -E '3103|3203'

            echo ""
            echo "=== tradeos.log ==="
            cat /tmp/tradeos.log 2>/dev/null || echo "no log"

            echo ""
            echo "=== sqlite files ==="
            ls -la /volume1/web/tradeos/data/ 2>/dev/null || echo "no data dir"

            echo ""
            echo "=== simple curl test ==="
            curl -si http://localhost:3103/ 2>/dev/null | grep -i "HTTP/\|location:"

            echo ""
            echo "=== nas-server.js removed? ==="
            ls /volume1/web/tradeos/nas-server.js 2>/dev/null && echo "STILL EXISTS" || echo "removed OK"
