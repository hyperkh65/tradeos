name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== nginx log files ==="
            find /var/log /tmp -name "*.log" 2>/dev/null | grep -i nginx | head -10 || echo "no nginx logs found"
            echo "=== nginx main config access_log ==="
            grep -r "access_log\|error_log" /etc/nginx/nginx.conf.run 2>/dev/null | head -5 || echo "not found"
            echo "=== curl gw via external IP with verbose TLS ==="
            curl -sk --max-time 8 -v https://gw.ynk2014.com/ 2>&1 | grep -E "< |SSL|TLS|Connect|timeout|error|Location" | head -20 || echo "verbose curl failed"
