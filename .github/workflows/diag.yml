name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            echo "=== 307 Location header from localhost:3103/ ==="
            curl -si http://localhost:3103/ 2>/dev/null | grep -i "location\|HTTP/"

            echo ""
            echo "=== 307 Location header from localhost:3103/api/auth/me ==="
            curl -si http://localhost:3103/api/auth/me 2>/dev/null | grep -i "location\|HTTP/"

            echo ""
            echo "=== nginx proxy config for gw.ynk2014.com ==="
            cat /etc/nginx/sites-enabled/server.ReverseProxy.conf 2>/dev/null | grep -A 30 "gw.ynk2014"

            echo ""
            echo "=== nginx proxy_set_header check ==="
            grep -r "proxy_set_header\|X-Forwarded\|proxy_pass" /etc/nginx/ 2>/dev/null | grep -v "^Binary" | head -30

            echo ""
            echo "=== tradeos server process ==="
            ps aux | grep -i "[s]erver.js\|tradeos\|3103" | head -5

            echo ""
            echo "=== port 3103 listener ==="
            netstat -tlnp 2>/dev/null | grep 3103 || ss -tlnp 2>/dev/null | grep 3103

            echo ""
            echo "=== tradeos.log (ALL content) ==="
            cat /tmp/tradeos.log 2>/dev/null || echo "no tradeos.log"

            echo ""
            echo "=== sqlite DB check ==="
            ls -la /volume1/web/tradeos/data/ 2>/dev/null || echo "data dir missing"
