name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            echo "=== DB users check ==="
            $NODE -e "
              try {
                const Database = require('/volume1/web/tradeos/.next/standalone/node_modules/better-sqlite3');
                const db = new Database('/volume1/web/tradeos/data/nexport.db');
                db.pragma('wal_checkpoint(FULL)');
                const users = db.prepare('SELECT id, email, name, role, status FROM users').all();
                console.log('users count:', users.length);
                users.forEach(u => console.log(' -', u.email, u.role, u.status));
                db.close();
              } catch(e) { console.error('DB ERROR:', e.message); }
            " 2>&1

            echo ""
            echo "=== tradeos.log ==="
            cat /tmp/tradeos.log 2>/dev/null || echo "no log"

            echo ""
            echo "=== test login API ==="
            curl -si -X POST http://localhost:3103/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"test@test.com","password":"wrongpass"}' 2>/dev/null | head -10

            echo ""
            echo "=== port 3103 still up? ==="
            ss -tlnp 2>/dev/null | grep 3103 || netstat -tlnp 2>/dev/null | grep 3103
