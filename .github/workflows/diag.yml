name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          script: |
            echo "=== Synology nginx vhost configs ==="
            find /etc/nginx -name "*.conf" 2>/dev/null | head -20
            echo "=== ReverseProxy nginx config ==="
            cat /etc/nginx/app.d/server.ReverseProxy.conf 2>/dev/null | head -60 || echo "not found"
            find /etc/nginx -name "*Reverse*" 2>/dev/null
            echo "=== all ports ==="
            netstat -tlnp 2>/dev/null
            echo "=== cert readability ==="
            cat /usr/syno/etc/certificate/ReverseProxy/5f653000-fc7f-4322-8afb-cbb6acf73394/RSA-fullchain.pem 2>/dev/null | head -3 || echo "CANNOT READ fullchain"
            cat /usr/syno/etc/certificate/ReverseProxy/5f653000-fc7f-4322-8afb-cbb6acf73394/RSA-privkey.pem 2>/dev/null | head -3 || echo "CANNOT READ privkey"
            openssl x509 -in /usr/syno/etc/certificate/ReverseProxy/5f653000-fc7f-4322-8afb-cbb6acf73394/RSA-cert.pem -noout -subject -issuer 2>/dev/null
