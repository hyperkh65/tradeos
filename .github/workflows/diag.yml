name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            echo "=== /volume1/web/newerp 내용 ==="
            ls /volume1/web/newerp/ 2>/dev/null || echo "없음"

            echo ""
            echo "=== newerp DB 찾기 ==="
            find /volume1/web/newerp -maxdepth 3 -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" 2>/dev/null | head -10

            echo ""
            echo "=== newerp package.json ==="
            cat /volume1/web/newerp/package.json 2>/dev/null | head -20 || echo "없음"

            echo ""
            echo "=== newerp .env or data dir ==="
            ls /volume1/web/newerp/data/ 2>/dev/null || echo "data dir 없음"
            ls /volume1/web/newerp/.env 2>/dev/null | head -5 || echo ".env 없음"

            echo ""
            echo "=== tradeos DB 현재 sales 카운트 ==="
            $NODE -e "
              const Database = require('/volume1/web/tradeos/.next/standalone/node_modules/better-sqlite3');
              const db = new Database('/volume1/web/tradeos/data/nexport.db');
              const cnt = db.prepare('SELECT COUNT(*) as c FROM sales').get();
              console.log('tradeos sales count:', cnt.c);
              db.close();
            " 2>&1
