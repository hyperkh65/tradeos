name: Build Windows Desktop App

# 수동 트리거 전용 — 데스크톱 설치파일은 웹 배포(deploy.yml)와 별개 주기로 나온다.
# 이 Mac에는 Windows 빌드 환경이 없어서, Windows installer(.msi/.exe)를 실제로
# 만들 수 있는 방법은 이 windows-latest 러너뿐이다.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 데스크톱 셸은 원격 URL을 그대로 로드하는 얇은 래퍼라 프론트엔드 빌드가 필요
      # 없다 — 필요한 건 @tauri-apps/cli뿐이다. package.json 전체로 `npm install`을
      # 돌리면 그룹웨어 웹앱의 네이티브 모듈(better-sqlite3 등)까지 컴파일하려다
      # Visual Studio C++ 빌드 도구가 없어서 실패한다(실제로 겪은 에러).
      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2.11.4

      - name: Build Windows installers
        run: npx tauri build

      - name: List and checksum artifacts
        shell: bash
        run: |
          set -e
          echo "=== bundle output ==="
          find src-tauri/target/release/bundle -type f \( -iname "*.msi" -o -iname "*.exe" \) -exec ls -la {} \;
          echo "=== sha256 ==="
          find src-tauri/target/release/bundle -type f \( -iname "*.msi" -o -iname "*.exe" \) -exec sha256sum {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: ynk-groupware-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
