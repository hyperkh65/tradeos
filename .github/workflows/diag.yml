name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            echo "=== DB table row counts ==="
            $NODE -e "
              try {
                const Database = require('/volume1/web/tradeos/.next/standalone/node_modules/better-sqlite3');
                const db = new Database('/volume1/web/tradeos/data/nexport.db');
                db.pragma('wal_checkpoint(FULL)');
                const tables = ['users','companies','products','sales','purchase_orders','quotes'];
                tables.forEach(t => {
                  try {
                    const cnt = db.prepare('SELECT COUNT(*) as c FROM ' + t).get();
                    console.log(t + ':', cnt.c);
                  } catch(e) { console.log(t + ': ERROR -', e.message); }
                });

                // show last 3 sales
                try {
                  const rows = db.prepare('SELECT business_id, sale_date, customer, total_amount FROM sales ORDER BY sale_date DESC LIMIT 3').all();
                  console.log('Last sales:', JSON.stringify(rows));
                } catch(e) { console.log('sales query error:', e.message); }

                // show last 3 companies
                try {
                  const rows = db.prepare('SELECT business_id, name, type FROM companies ORDER BY created_at DESC LIMIT 3').all();
                  console.log('Last companies:', JSON.stringify(rows));
                } catch(e) { console.log('companies query error:', e.message); }

                db.close();
              } catch(e) { console.error('DB ERROR:', e.message); }
            " 2>&1

            echo ""
            echo "=== API test (need session cookie) ==="
            # First get a session cookie by logging in
            LOGIN_RESP=$(curl -si -X POST http://localhost:3103/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"hyperkh65@gmail.com","password":""}' 2>/dev/null)
            echo "Login response: $(echo "$LOGIN_RESP" | tail -1)"

            echo ""
            echo "=== tradeos.log (last 20 lines) ==="
            tail -20 /tmp/tradeos.log 2>/dev/null || echo "no log"

            echo ""
            echo "=== port 3103 still up? ==="
            ss -tlnp 2>/dev/null | grep 3103 || netstat -tlnp 2>/dev/null | grep 3103
