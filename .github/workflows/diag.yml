name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== PID listening on port 443 ==="
            HEX443=$(printf '%04X' 443)
            INODE=$(cat /proc/net/tcp6 /proc/net/tcp 2>/dev/null | awk -v h=":$HEX443" '$2 ~ h && $4=="0A" {print $10}' | head -1)
            echo "Port 443 inode: $INODE"
            if [ -n "$INODE" ]; then
              for pid in $(ls /proc | grep -E '^[0-9]+$'); do
                ls -la /proc/$pid/fd 2>/dev/null | grep -q "socket:\[$INODE\]" && echo "PID $pid owns port 443" && cat /proc/$pid/cmdline 2>/dev/null | tr '\0' ' ' && echo
              done
            fi
            echo "=== http.miracool.conf ==="
            cat /usr/local/etc/nginx/conf.d/http.miracool.conf 2>/dev/null || echo "NOT FOUND"
            echo "=== sites-enabled contents ==="
            ls /etc/nginx/sites-enabled/ 2>/dev/null && cat /etc/nginx/sites-enabled/* 2>/dev/null || echo "empty or not accessible"
            echo "=== tradeos.log tail ==="
            tail -20 /tmp/tradeos.log 2>/dev/null
