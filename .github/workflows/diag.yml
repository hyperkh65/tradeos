name: NAS Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Root Cause Diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== nginx port 443/80 listening? ==="
            netstat -tlnp 2>/dev/null | grep -E ':443 |:80 ' || echo "443/80 NOT FOUND"
            echo "=== nginx status ==="
            ps aux 2>/dev/null | grep nginx | grep -v grep || echo "nginx NOT RUNNING"
            echo "=== nginx gw proxy config ==="
            grep -B2 -A10 "proxy_pass.*3103" /etc/nginx/sites-enabled/* 2>/dev/null || echo "no 3103 proxy found"
            echo "=== curl via nginx (HTTPS) ==="
            curl -sk -o /dev/null -w "status:%{http_code}" https://localhost/ -H "Host: gw.ynk2014.com" 2>/dev/null || echo "curl https failed"
            echo "=== curl via nginx (HTTP) ==="
            curl -s -o /dev/null -w "status:%{http_code}" http://localhost/ -H "Host: gw.ynk2014.com" 2>/dev/null || echo "curl http failed"
            echo "=== external IP ==="
            curl -s --max-time 5 ifconfig.me 2>/dev/null || echo "cannot reach ifconfig.me"
